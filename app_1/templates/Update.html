{% load crispy_forms_tags %}
<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </head>
    <body>


            <div class='mt-5 col-6 offset-3'>
               
                <form method='POST' class='p-5 border border-dark border-2 rounded rounded-3' >
                    {% csrf_token %}
                    {{forms.Emp_id|as_crispy_field}}
                    {{forms.Emp_name|as_crispy_field}}
                    {{forms.Emp_mobile|as_crispy_field}}
                    {{forms.Emp_email|as_crispy_field}}
                    {{forms.Emp_status|as_crispy_field}}
                    <div class='text-center'>
                    <button class='btn btn-success'>Submit</button>
                    <a href="{% url 'index_page' %}" class='btn btn-danger'>Cancle</a>
                    </div>
                </form>
            </div>

       

    </body>
</html>
